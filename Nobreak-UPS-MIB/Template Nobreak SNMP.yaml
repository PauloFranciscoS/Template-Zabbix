zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: e804f85e4da84bd79888915b2ef620e7
      name: Templates/Network devices
  templates:
    - uuid: f4e15038bcae412eb606796c9c898b3c
      template: 'Template Nobreak SNMP'
      name: 'Template Nobreak SNMP'
      description: 'Template completo para monitoramento de Nobreak via SNMP (Padrão UPS-MIB). Inclui monitoramento de energia, bateria, temperatura e disponibilidade de rede (Ping/Loss).'
      groups:
        - name: Templates/Network devices
      items:
        - uuid: c6bc620ad10e42f592f8ef85c889f074
          name: 'Disponibilidade: Status do Ping'
          type: SIMPLE
          key: 'icmpping[{HOST.CONN}]'
          delay: 1m
          value_type: FLOAT
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: a93b58fb81ea42de88a536551b920150
              expression: 'last(/Template Nobreak SNMP/icmpping[{HOST.CONN}])=0'
              name: 'Nobreak Inacessível (Ping Down)'
              priority: HIGH
              description: 'O Zabbix não consegue alcançar o IP do Nobreak via ICMP (Ping).'
        - uuid: d58b091f0c2a4729ae55e51928df7de4
          name: 'Disponibilidade: Perda de Pacotes ICMP'
          type: SIMPLE
          key: 'icmppingloss[{HOST.CONN}]'
          delay: 1m
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: e0811eef2a874b33a5712fdfcb2c8ba6
              expression: 'min(/Template Nobreak SNMP/icmppingloss[{HOST.CONN}],5m)>20'
              name: 'Alta perda de pacotes na rede (>20% em 5 min)'
              priority: WARNING
        - uuid: b48ff2bb74b64811a2f6fb39f60ed712
          name: 'Bateria: Carga Restante'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.2.1.33.1.2.4.0'
          key: ups.battery.charge
          delay: 1m
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: battery
          triggers:
            - uuid: f956d7879e134ab68c9eb92f6ccebf96
              expression: 'last(/Template Nobreak SNMP/ups.battery.charge)<30'
              name: 'Nobreak com bateria abaixo de 30% (Risco de Desligamento)'
              priority: DISASTER
        - uuid: a8b27dbfc19d44cfbc17673550ba9a04
          name: 'Bateria: Tensão'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.2.1.33.1.2.5.0'
          key: ups.battery.voltage
          delay: 1m
          value_type: FLOAT
          units: 'V'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: battery
        - uuid: c1bd56e3b56a4220b411d31bf5938f8f
          name: 'Bateria: Temperatura'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.2.1.33.1.2.7.0'
          key: ups.battery.temperature
          delay: 1m
          value_type: FLOAT
          units: '°C'
          tags:
            - tag: component
              value: environment
          triggers:
            - uuid: d86b6bc7c3e143b49fa4693a77a94a48
              expression: 'last(/Template Nobreak SNMP/ups.battery.temperature)>35'
              name: 'Temperatura do Nobreak Alta (> 35°C)'
              priority: AVERAGE
        - uuid: eb530db8264e43ce893bc4ce5187e5b2
          name: 'Bateria: Status de Saúde'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.2.1.33.1.2.1.0'
          key: ups.battery.status
          delay: 1m
          value_type: UNSIGNED
          valuemap:
            name: 'UPS Battery Status'
          tags:
            - tag: component
              value: battery
        - uuid: f5a8947f152d4323b6b1076f7ed7d884
          name: 'Entrada: Tensão da Rede'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.2.1.33.1.3.3.1.3.1'
          key: ups.input.voltage
          delay: 1m
          value_type: FLOAT
          units: 'V'
          tags:
            - tag: component
              value: power
        - uuid: a01ab5b5d5354ffea3ed4cf05c6d8639
          name: 'Entrada: Frequência'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.2.1.33.1.3.3.1.2.1'
          key: ups.input.frequency
          delay: 1m
          value_type: FLOAT
          units: 'Hz'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: power
        - uuid: be0cbabdf9d4434ca44ab58b5b7190f8
          name: 'Saída: Tensão para Equipamentos'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.2.1.33.1.4.4.1.2.1'
          key: ups.output.voltage
          delay: 1m
          value_type: FLOAT
          units: 'V'
          tags:
            - tag: component
              value: power
        - uuid: cd67f8b9e60249cdae8f52ef1381283c
          name: 'Saída: Fonte Atual (Detector de Queda)'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.2.1.33.1.4.1.0'
          key: ups.output.source
          delay: 30s
          value_type: UNSIGNED
          valuemap:
            name: 'UPS Output Source'
          tags:
            - tag: component
              value: power
          triggers:
            - uuid: e4695eb07f084ba3b61da2e56eb60002
              expression: 'last(/Template Nobreak SNMP/ups.output.source)<>3'
              name: 'Nobreak operando na Bateria (Falta de energia da concessionária!)'
              priority: HIGH
      macros:
        - macro: '{$SNMP_COMMUNITY}'
          value: 'public'
          description: 'Community SNMP do Nobreak'
      valuemaps:
        - uuid: f11d17fb69214df9964147779f67a213
          name: 'UPS Battery Status'
          mappings:
            - value: '1'
              newvalue: 'Desconhecido'
            - value: '2'
              newvalue: 'Normal'
            - value: '3'
              newvalue: 'Bateria Baixa'
            - value: '4'
              newvalue: 'Esgotada'
        - uuid: a3e9c6de1c42416b8b15d03a111b11b5
          name: 'UPS Output Source'
          mappings:
            - value: '1'
              newvalue: 'Outro'
            - value: '2'
              newvalue: 'Nenhum'
            - value: '3'
              newvalue: 'Rede Elétrica (Normal)'
            - value: '4'
              newvalue: 'Bypass'
            - value: '5'
              newvalue: 'Bateria (Queda de Energia)'
            - value: '6'
              newvalue: 'Booster'
            - value: '7'
              newvalue: 'Reducer'